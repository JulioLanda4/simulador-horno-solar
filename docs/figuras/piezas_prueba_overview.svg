<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .bg{fill:#f6f7f4}
      .panel{fill:#ffffff;stroke:#c7ccc3;stroke-width:2}
      .part{fill:#d9e5df;stroke:#32423b;stroke-width:3}
      .part2{fill:#f0d58a;stroke:#51421d;stroke-width:3}
      .cut{fill:#ffffff;stroke:#32423b;stroke-width:2}
      .dim{stroke:#6b756f;stroke-width:2;stroke-dasharray:6 6}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#1e2522}
      .title{font-size:26px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .small{font-size:15px}
      .tiny{font-size:13px}
    </style>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <text x="40" y="48" class="txt title">Primer paquete de piezas de prueba</text>
  <text x="40" y="78" class="txt small">Esquema conceptual de las piezas OpenSCAD; no es render STL final.</text>

  <!-- Panel 1 -->
  <rect x="40" y="110" width="520" height="200" rx="8" class="panel"/>
  <text x="65" y="145" class="txt label">1. Placa de alojamientos 608ZZ</text>
  <rect x="95" y="178" width="400" height="70" rx="4" class="part"/>
  <circle cx="170" cy="213" r="32" class="cut"/>
  <circle cx="170" cy="213" r="18" class="cut"/>
  <circle cx="295" cy="213" r="33" class="cut"/>
  <circle cx="295" cy="213" r="18" class="cut"/>
  <circle cx="420" cy="213" r="34" class="cut"/>
  <circle cx="420" cy="213" r="18" class="cut"/>
  <text x="150" y="276" class="txt tiny">22.1</text>
  <text x="275" y="276" class="txt tiny">22.2</text>
  <text x="400" y="276" class="txt tiny">22.3</text>
  <text x="65" y="296" class="txt tiny">Sirve para encontrar el ajuste real del rodamiento en PETG.</text>

  <!-- Panel 2 -->
  <rect x="640" y="110" width="520" height="200" rx="8" class="panel"/>
  <text x="665" y="145" class="txt label">2. Abrazadera partida para eje de 8 mm</text>
  <rect x="805" y="175" width="190" height="95" rx="8" class="part"/>
  <circle cx="900" cy="222" r="30" class="cut"/>
  <line x1="805" y1="222" x2="995" y2="222" class="dim"/>
  <circle cx="860" cy="198" r="8" class="cut"/>
  <circle cx="940" cy="198" r="8" class="cut"/>
  <text x="805" y="292" class="txt tiny">Ranura central + 2 tornillos M3 para apretar sobre el eje.</text>

  <!-- Panel 3 -->
  <rect x="40" y="350" width="520" height="210" rx="8" class="panel"/>
  <text x="65" y="385" class="txt label">3. Tramo corto de riel doble guia</text>
  <rect x="105" y="490" width="380" height="32" class="part"/>
  <rect x="145" y="430" width="65" height="60" class="part"/>
  <rect x="380" y="430" width="65" height="60" class="part"/>
  <rect x="270" y="462" width="50" height="28" class="part"/>
  <line x1="177" y1="412" x2="412" y2="412" class="dim"/>
  <text x="248" y="405" class="txt tiny">separacion aprox. 50 mm</text>
  <text x="65" y="545" class="txt tiny">Perfil simple, robusto y facil de imprimir en tramos.</text>

  <!-- Panel 4 -->
  <rect x="640" y="350" width="520" height="210" rx="8" class="panel"/>
  <text x="665" y="385" class="txt label">4. Mini carro del receptor</text>
  <rect x="785" y="420" width="230" height="95" rx="6" class="part2"/>
  <rect x="815" y="478" width="58" height="37" class="cut"/>
  <rect x="927" y="478" width="58" height="37" class="cut"/>
  <circle cx="1010" cy="468" r="9" class="cut"/>
  <circle cx="865" cy="444" r="7" class="cut"/>
  <circle cx="935" cy="444" r="7" class="cut"/>
  <text x="775" y="545" class="txt tiny">Canales inferiores abrazan las dos guias; tornillo lateral bloquea posicion.</text>

  <!-- Panel 5 -->
  <rect x="40" y="600" width="1120" height="180" rx="8" class="panel"/>
  <text x="65" y="635" class="txt label">5. Polea GT2 impresa aproximada, 60 dientes, bore 8 mm</text>
  <g transform="translate(250,690)">
    <circle r="64" class="part2"/>
    <circle r="30" class="part"/>
    <circle r="15" class="cut"/>
    <rect x="-80" y="-4" width="160" height="8" class="cut"/>
    <circle cx="-22" cy="-28" r="7" class="cut"/>
    <circle cx="22" cy="28" r="7" class="cut"/>
    <g stroke="#51421d" stroke-width="2">
      <line x1="0" y1="-78" x2="0" y2="-66"/>
      <line x1="0" y1="78" x2="0" y2="66"/>
      <line x1="-78" y1="0" x2="-66" y2="0"/>
      <line x1="78" y1="0" x2="66" y2="0"/>
      <line x1="55" y1="55" x2="47" y2="47"/>
      <line x1="-55" y1="-55" x2="-47" y2="-47"/>
      <line x1="55" y1="-55" x2="47" y2="-47"/>
      <line x1="-55" y1="55" x2="-47" y2="47"/>
    </g>
  </g>
  <text x="380" y="675" class="txt small">Uso inicial:</text>
  <text x="380" y="704" class="txt tiny">- verificar bore 8.2 mm y abrazadera partida</text>
  <text x="380" y="728" class="txt tiny">- comprobar si la correa GT2 de 6 mm asienta y no salta</text>
  <text x="380" y="752" class="txt tiny">- validar espacio y relacion 60:20 = 3:1</text>
  <text x="760" y="704" class="txt tiny">Nota: el perfil de diente es aproximado.</text>
  <text x="760" y="728" class="txt tiny">Si funciona mecanicamente, luego refinamos perfil GT2.</text>
</svg>
